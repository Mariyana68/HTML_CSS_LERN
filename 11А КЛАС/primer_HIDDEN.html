<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Детска кухня</title>

    <style>

        /* Нулиране на стандартните отстояния */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        /* Форматиране на цялата страница */
        body{
            background-color:#f5f5f5;
            font-family:Arial;
        }

        /* Главен контейнер на сайта */
        #wrapper{
            width:1000px;
            margin:auto;
            background:white;
        }

        /* Горна част на сайта */
        header{
            background:#ffe082;
            padding:20px;
        }

        /* Лого */
        .logo{
            font-size:32px;
            font-weight:bold;
            color:#e65100;
        }

        /* Слоган */
        .slogan{
            font-size:18px;
            margin-top:10px;
            color:#444;
        }

        /* Навигационно меню */
        nav{
            background:#ff9800;
        }

        /* Премахване на точките от списъка */
        nav ul{
            list-style:none;
            display:flex;
        }

        /* Всеки бутон заема еднакво място */
        nav ul li{
            flex:1;
            text-align:center;
        }

        /* Стил на линковете */
        nav ul li a{
            display:block;
            text-decoration:none;
            color:white;
            padding:15px;
            font-weight:bold;
        }

        /* Ефект при посочване */
        nav ul li a:hover{
            background:#e65100;
        }

        /* Основно съдържание */
        #main{
            padding:20px;
        }

        /* Заглавие */
        #main h2{
            margin-bottom:20px;
            color:#333;
        }

        /* Контейнер за ястията */
        .foods{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }

        /* Всяко ястие */
        .food-box{
            width:230px;
            background:#fff3e0;
            border:1px solid orange;
            padding:15px;
            text-align:center;
            border-radius:10px;
        }

        /* Скриваме този елемент, но мястото му остава */
        .hidden-food{
            visibility:hidden;
        }

    </style>

</head>

<body>

    <!-- Главен контейнер -->
    <div id="wrapper">

        <!-- Горна част -->
        <header>

            <!-- Лого -->
            <div class="logo">
                🍴 Детска кухня
            </div>

            <!-- Слоган -->
            <div class="slogan">
                Вкусна и полезна храна за вашето бебе
            </div>

        </header>

        <!-- Меню -->
        <nav>

            <ul>

                <!-- Бутон 1 -->
                <li><a href="#">Постни ястия</a></li>

                <!-- Бутон 2 -->
                <li><a href="#">Местни ястия</a></li>

                <!-- Бутон 3 -->
                <li><a href="#">Десерти</a></li>

            </ul>

        </nav>

        <!-- Основно съдържание -->
        <div id="main">

            <!-- Заглавие -->
            <h2>Месни ястия за бебета</h2>

            <!-- Контейнер с ястия -->
            <div class="foods">

                <!-- Ястие 1 -->
                <div class="food-box">
                    Пилешко пюре с картофи
                </div>

                <!-- Ястие 2 -->
                <div class="food-box">
                    Пуешко със зеленчуци
                </div>

                <!-- Ястие 3 -->
                <div class="food-box">
                    Телешко пюре с моркови
                </div>

                <!-- Ястие 4 -->
                <div class="food-box">
                    Заешко с тиквички
                </div>

                <!-- Ястие 5 -->
                <div class="food-box">
                    Пилешко с ориз
                </div>

                <!-- Ястие 6 -->
                <div class="food-box">
                    Телешко с броколи
                </div>

                <!-- Ястие 7 -->
                <div class="food-box">
                    Пуешко с тиква
                </div>

                <!-- Ястие 8 - скрито -->
                <div class="food-box hidden-food">
                    Агнешко със зеленчуци
                </div>

            </div>

        </div>

    </div>

</body>
</html>
