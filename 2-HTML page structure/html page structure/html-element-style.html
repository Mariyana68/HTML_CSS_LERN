<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>HTML - елемент style</title>
    <style>
        body {background-color: powderblue;}
        p {color: maroon;}
    </style> 
</head>

<body>
    <p>Прилагане на елемент style в head част на HTML документ.</p>
    <p>Свойство background-color задава цвета на фона на страницата, а свойство color цвета на параграфите.</p>
</body>

</html>
